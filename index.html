<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Models Tier List</title>
<meta name="description" content="Rank 57 AI models and tools from S to D, then share your tier list with a link. Free, no account needed.">
<meta property="og:title" content="AI Models Tier List">
<meta property="og:description" content="Rank GPT, Claude, Gemini, Grok, Kimi, Midjourney, Veo and more from S to D. Share your ranking with one link.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#252427">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff7f7f'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='900' font-size='20' text-anchor='middle' fill='%23333'%3ES%3C/text%3E%3C/svg%3E">
<style>
/* Layout: one centered column ~1120px — toolbar, share row, tier rows (label | dropzone | controls), filters, card collection. Single dark look, matching the reference. */
:root{
  --page:#252427; --panel:#1b1b19; --row-line:#000; --ctl:#000;
  --btn:#000; --btn-line:#5a5a5a; --ink:#f2f2f2; --dim:#a7a7ad; --muted:#6d6d74;
  --chip:#2f2e33; --chip-on:#f2f2f2; --chip-on-ink:#111;
  --tw:#1d9bf0; --fb:#4267b2; --focus:#ffd34d; --danger:#ff5d6c; --ok:#58e08a;
  --cat-text:#c27bff; --cat-reasoning:#ff7ad1; --cat-coding:#4fd1ff; --cat-image:#ffb84d; --cat-video:#ff6b6b; --cat-audio:#6bffb8; --cat-research:#9fb4ff; --cat-agent:#4fd1ff;
  --ui:Arial,"Helvetica Neue",Helvetica,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--ui);font-size:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1120px;margin:0 auto}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;padding:2px 0 10px}
.tbtn{background:var(--btn);border:1px solid var(--btn-line);border-radius:5px;padding:10px 10px;font-size:16px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;line-height:1}
.tbtn:hover{border-color:#9a9a9a}
.ico{width:20px;height:20px;flex:none}
.share{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap;align-items:center}
.sbtn{color:#fff;border:0;border-radius:4px;padding:10px 10px;font-size:15px;cursor:pointer;text-decoration:none;line-height:1;display:inline-block}
.sbtn.tw{background:var(--tw)}.sbtn.fb{background:var(--fb)}
.hint{color:var(--muted);font-size:13px;margin-left:8px}

/* tier list */
.tiers{border:1px solid var(--row-line);background:var(--row-line)}
.tier{display:flex;min-height:80px;border-bottom:1px solid var(--row-line)}
.tier:last-child{border-bottom:0}
.tlabel{width:100px;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;color:#333;font-size:14px;padding:4px;word-break:break-word;cursor:text}
.tzone{flex:1;min-width:0;background:var(--panel);display:flex;flex-wrap:wrap;align-content:flex-start;gap:0;padding:0;min-height:80px}
.tzone.over,.pool.over,.acell.over{box-shadow:inset 0 0 0 2px var(--focus)}
.tctl{width:80px;flex:none;background:var(--ctl);display:flex;align-items:center;justify-content:center;gap:6px}
.gear,.arrow{background:none;border:0;cursor:pointer;padding:2px;display:flex}
.arrows{display:flex;flex-direction:column;gap:10px}

/* cards */
.card{position:relative;width:66px;height:80px;flex:none;border-radius:8px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;margin:0}
.card.armed{transform:scale(1.08);transition:transform .12s}
.tzone .card{border-radius:0}
.cardin{position:absolute;inset:4px 5px 3px;border-radius:8px;border:2px solid var(--c,#c27bff);box-shadow:0 0 7px var(--c,#c27bff),inset 0 0 6px rgba(255,255,255,.18);background:var(--bg,linear-gradient(160deg,#3a2a60,#141225));overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:4px 2px 3px}
.cardin .cprov{margin-top:auto}
.gem{position:absolute;top:-1px;left:50%;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:var(--c,#c27bff);border:1px solid rgba(255,255,255,.7);border-radius:2px}
.logo{width:30px;height:30px;flex:none;margin-top:4px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.07);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.logo img{width:22px;height:22px;object-fit:contain;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
.cname{font-size:9px;line-height:1.05;font-weight:700;color:#fff;text-align:center;max-height:19px;overflow:hidden;width:100%;padding:0 1px}
.cprov{font-size:8px;color:rgba(255,255,255,.75);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.flag{position:absolute;right:2px;top:12px;font-size:7.5px;font-weight:800;background:rgba(0,0,0,.65);color:#ffd34d;padding:1px 2px;border-radius:3px}
.card.dragging{opacity:.25}
.ghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.08);filter:drop-shadow(0 10px 16px rgba(0,0,0,.6))}
.ph{width:66px;height:80px;flex:none;border:2px dashed var(--focus);border-radius:8px;opacity:.8}

/* collection */
.collhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:18px 0 8px}
.collhead h2{font-size:14px;font-weight:400;margin:0;display:flex;gap:6px;align-items:center}
.counts{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.search{background:#111;border:1px solid var(--btn-line);color:var(--ink);border-radius:4px;padding:8px 10px;font-size:14px;width:220px;max-width:100%}
.chip{background:var(--chip);border:1px solid #3c3b41;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.sep{width:1px;height:22px;background:#444;margin:0 4px}
.pool{display:flex;flex-wrap:wrap;gap:2px;min-height:90px;padding:4px;border-radius:6px}
.mini{background:#111;border:1px solid var(--btn-line);border-radius:4px;padding:7px 10px;font-size:13px;cursor:pointer}
.mini.danger{border-color:#6a2d33;color:#ffb3ba}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* tooltip */
.tip{position:fixed;z-index:150;max-width:260px;background:#0d0d0f;border:1px solid #444;border-radius:6px;padding:9px 10px;font-size:12.5px;line-height:1.35;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.tip b{font-size:13.5px}.tip .p{color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:10.5px;padding:2px 6px;border-radius:999px;background:#26252b;color:#ddd}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#1a1a1d;border:1px solid #444;border-radius:8px;width:min(720px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .sub{color:var(--dim);font-size:13px;margin:0 0 14px;line-height:1.4}
.mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.mrow label{color:var(--dim);font-size:13px}
.inp{background:#111;border:1px solid var(--btn-line);color:var(--ink);border-radius:4px;padding:7px 9px;font-size:14px;min-width:0}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.primary{background:#f2f2f2;color:#111;border:0}
.note{font-size:12.5px;color:var(--dim);background:#121214;border:1px solid #333;border-radius:6px;padding:8px 10px;line-height:1.4}
canvas.prev{width:100%;height:auto;border-radius:6px;background:#000;display:block}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:4px;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:#fff}

/* alignment chart */
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#000;padding:4px;border-radius:6px}
.acell{background:var(--panel);min-height:110px;display:flex;flex-direction:column;min-width:0}
.acell .ah{font-size:11.5px;font-weight:700;padding:5px 6px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.acell .az{display:flex;flex-wrap:wrap;flex:1;align-content:flex-start}

/* poll & community */
.bars{display:grid;grid-template-columns:28px 1fr 34px;gap:6px 8px;align-items:center;font-variant-numeric:tabular-nums}
.bar{height:16px;border-radius:3px;background:#2a2a2e;overflow:hidden}.bar i{display:block;height:100%}
.vote{display:flex;gap:6px;flex-wrap:wrap}
.vbtn{width:44px;height:38px;border-radius:5px;border:0;font-weight:800;color:#222;cursor:pointer;font-size:16px}
.crank{display:grid;grid-template-columns:30px 66px 1fr 70px;gap:6px 10px;align-items:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f2f2f2;color:#111;padding:9px 14px;border-radius:6px;z-index:400;font-size:13.5px;font-weight:700}
.wheelwrap{position:relative;width:min(420px,100%);margin:0 auto}
.pointer{position:absolute;top:-4px;left:50%;margin-left:-11px;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid #fff;z-index:2}

.sbtn.sh{background:#7c4dff}.sbtn.my{background:#3a3940}
.rhead{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.rtitle{background:transparent;border:1px solid transparent;color:var(--ink);font:700 22px/1.2 var(--ui);padding:4px 6px;border-radius:4px;width:100%}
.rdesc{background:transparent;border:1px solid transparent;color:var(--dim);font:14px/1.35 var(--ui);padding:4px 6px;border-radius:4px;width:100%;resize:none}
.rtitle:hover,.rdesc:hover{border-color:#444}.rtitle:focus,.rdesc:focus{border-color:#777;background:#151517}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#1f1a33;border:1px solid #5b47b8;border-radius:6px;padding:10px 12px;margin:0 0 10px}
.banner.err{background:#331a1d;border-color:#8a3a44}
.banner p{margin:0;flex:1;min-width:200px;line-height:1.35}
.readonly .gear,.readonly .arrow,.readonly .collhead,.readonly .filters,.readonly #pool,.readonly .actions,.readonly .hint{display:none}
.readonly .card{cursor:default}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#121214;border:1px solid #333;border-radius:6px;padding:8px 10px}
.ritem.cur{border-color:#7c4dff}
.ritem .nm{flex:1;min-width:140px;font-weight:700}
.ritem .meta{color:var(--dim);font-size:12px;font-weight:400;display:block;margin-top:2px}
.linkbox{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
@media (max-width:640px){
  .tlabel{width:62px;font-size:12px}
  .tctl{width:46px;flex-direction:column;gap:2px}
  .arrows{gap:2px}
  .tbtn{font-size:13px;padding:8px}
  .toolbar{gap:8px}
  .crank{grid-template-columns:24px 66px 1fr 56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="wrap">
  <div class="toolbar" role="toolbar" aria-label="Tools">
    <button class="tbtn" id="btnMeme" type="button">Create a Meme</button>
    <button class="tbtn" id="btnWheel" type="button"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" rx="3" fill="#fff"/><path d="M10 10 10 1A9 9 0 0 1 18.5 7z" fill="#e94b3c"/><path d="M10 10 18.5 7A9 9 0 0 1 15 17.5z" fill="#f5b400"/><path d="M10 10 15 17.5A9 9 0 0 1 4 17z" fill="#3cba54"/><path d="M10 10 4 17A9 9 0 0 1 1.5 7z" fill="#4885ed"/><path d="M10 10 1.5 7A9 9 0 0 1 10 1z" fill="#a142f4"/></svg>Spin Random Wheel</button>
    <button class="tbtn" id="btnPoll" type="button"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="#e5484d"/></svg>Live Voting Poll</button>
    <button class="tbtn" id="btnAlign" type="button"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="2" width="16" height="16"/><path d="M10 2v16M2 10h16"/></svg>Alignment Chart</button>
    <button class="tbtn" id="btnCommunity" type="button"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><g><rect x="1" y="1" width="5" height="5" rx="1" fill="#f28b82"/><rect x="7.5" y="1" width="5" height="5" rx="1" fill="#f28b82"/><rect x="14" y="1" width="5" height="5" rx="1" fill="#555"/><rect x="1" y="7.5" width="5" height="5" rx="1" fill="#fdd663"/><rect x="7.5" y="7.5" width="5" height="5" rx="1" fill="#fdd663"/><rect x="14" y="7.5" width="5" height="5" rx="1" fill="#555"/><rect x="1" y="14" width="5" height="5" rx="1" fill="#81c995"/><rect x="7.5" y="14" width="5" height="5" rx="1" fill="#81c995"/><rect x="14" y="14" width="5" height="5" rx="1" fill="#81c995"/></g></svg>Community Rank</button>
  </div>

  <div class="share">
    <a class="sbtn tw" id="shareX" href="#" target="_blank" rel="noopener">Share on Twitter</a>
    <a class="sbtn fb" id="shareFB" href="#" target="_blank" rel="noopener">Share on FB</a>
    <button class="sbtn sh" id="btnShareRank" type="button">Share Ranking</button>
    <button class="sbtn my" id="btnMine" type="button">My rankings</button>
    <span class="hint">Drag cards into a tier (on a phone, press and hold first). Drag back down to unrank.</span>
  </div>

  <div id="banner"></div>
  <div class="rhead">
    <input class="rtitle" id="rtitle" maxlength="80" aria-label="Ranking title" placeholder="Name your ranking">
    <textarea class="rdesc" id="rdesc" rows="1" maxlength="280" aria-label="Ranking description" placeholder="Add a short description (optional)"></textarea>
  </div>
  <div class="tiers" id="tiers" aria-label="Tier list"></div>

  <div class="collhead">
    <h2><span aria-hidden="true">📌</span> Pin Images</h2>
    <span class="counts" id="counts"></span>
  </div>
  <div class="filters" role="group" aria-label="Filters">
    <input class="search" id="q" type="search" placeholder="Search model or provider" aria-label="Search models">
    <span id="catChips" style="display:contents"></span>
    <span class="sep" aria-hidden="true"></span>
    <span id="accChips" style="display:contents"></span>
  </div>
  <div class="pool" id="pool" aria-label="Model collection"></div>

  <div class="actions">
    <button class="mini" id="btnAddTier" type="button">+ Add tier</button>
    <button class="mini" id="btnPng" type="button">Download PNG</button>
    <button class="mini" id="btnExport" type="button">Export JSON</button>
    <button class="mini" id="btnImport" type="button">Import JSON</button>
    <button class="mini danger" id="btnReset" type="button">Reset tier list</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

/* ============================================================
   5. DRAG AND DROP (pointer events: mouse + touch + pen)
   Zones: [data-zone] elements. "pool" zone unranks.
   ============================================================ */
let drag=null;
/* finishDrag is defined below cleanupDrag */
document.addEventListener("pointerdown",e=>{
  const card=e.target.closest(".card");if(!card||e.button>0||(readOnly&&!card.closest(".scrim")))return;
  drag={id:card.dataset.id,src:card,x0:e.clientX,y0:e.clientY,active:false,pid:e.pointerId,touch:e.pointerType!=="mouse",armed:false};
  if(drag.touch){const d=drag;d.timer=setTimeout(()=>{if(drag===d&&!d.active){d.armed=true;card.classList.add("armed");try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}}},230);}
});
document.addEventListener("touchmove",e=>{if(drag&&(drag.armed||drag.active))e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest(".card"))e.preventDefault();});
document.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.active){const dist=Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0);
    if(drag.touch&&!drag.armed){if(dist>8){clearTimeout(drag.timer);drag=null;}return;}
    if(dist<6)return;startDrag(e);}
  e.preventDefault();
  drag.ghost.style.left=e.clientX+"px";drag.ghost.style.top=e.clientY+"px";
  updateDrop(e.clientX,e.clientY);
},{passive:false});
document.addEventListener("pointerup",e=>{if(!drag)return;clearTimeout(drag.timer);drag.src.classList.remove("armed");if(drag.active)finishDrag();drag=null;});
document.addEventListener("pointercancel",()=>{if(!drag)return;clearTimeout(drag.timer);drag.src.classList.remove("armed");if(drag.active)cancelDrag();drag=null;});
function startDrag(e){
  hideTip();drag.active=true;drag.src.classList.remove("armed");
  drag.ghost=drag.src.cloneNode(true);drag.ghost.classList.add("ghost");document.body.appendChild(drag.ghost);
  drag.src.classList.add("dragging");
  drag.ph=document.createElement("div");drag.ph.className="ph";
  try{drag.src.setPointerCapture(drag.pid)}catch(_){}
}
function zoneAt(x,y){
  drag.ghost.style.display="none";const el=document.elementFromPoint(x,y);drag.ghost.style.display="";
  if(!el)return null;
  const z=el.closest("[data-zone]");if(z)return z;
  if(el.closest(".tier")){return el.closest(".tier").querySelector("[data-zone]");}
  return null;
}
function updateDrop(x,y){
  document.querySelectorAll(".over").forEach(n=>n.classList.remove("over"));
  const z=zoneAt(x,y);drag.zone=z;
  if(!z){drag.ph.remove();return;}
  z.classList.add("over");
  if(z.dataset.zone==="pool"){drag.ph.remove();return;}
  const cards=[...z.querySelectorAll(":scope > .card:not(.dragging)")];
  let before=null;
  for(const c of cards){const r=c.getBoundingClientRect();if(y<r.top-4)continue;if(y>r.bottom+4)continue;if(x<r.left+r.width/2){before=c;break;}}
  if(!before&&cards.length){const last=cards[cards.length-1].getBoundingClientRect();if(y<last.top){before=cards.find(c=>c.getBoundingClientRect().bottom>=y)||null;}}
  before?z.insertBefore(drag.ph,before):z.appendChild(drag.ph);
}
function cleanupDrag(){
  drag.phRef=drag.ph;
  const z=drag.ph.parentElement;
  if(z){const kids=[...z.children].filter(n=>(n.classList.contains("card")&&!n.classList.contains("dragging"))||n===drag.ph);drag.phIndex=kids.indexOf(drag.ph);}
  // compute index before removing placeholder
  drag.ph.replaceWith?drag.ph.remove():0;
  drag.ghost.remove();drag.src.classList.remove("dragging");
  document.querySelectorAll(".over").forEach(n=>n.classList.remove("over"));
}
function cancelDrag(){cleanupDrag();renderAll();}
let finishDrag=function(){
  const z=drag.zone;cleanupDrag();
  if(!z)return renderAll();
  const zone=z.dataset.zone;
  if(zone==="pool"){place(drag.id,null);return commit();}
  if(zone.startsWith("align-")){const k=zone.slice(6);for(const v of Object.values(state.align)){const i=v.indexOf(drag.id);if(i>-1)v.splice(i,1)}(state.align[k]=state.align[k]||[]).push(drag.id);save();renderAlign();return;}
  place(drag.id,zone,drag.phIndex>=0?drag.phIndex:undefined);commit();
};
// keyboard: Enter on a focused collection card sends it to the first tier; Delete unranks
document.addEventListener("keydown",e=>{

function drawCard(ctx,id,x,y,w,h){
  const m=BYID[id];const [c1,c2]=PROV[m.provider]||["#888","#222"];
  const catc=getComputedStyle(document.documentElement).getPropertyValue(CATCOLOR[m.cat]).trim()||"#c27bff";
  ctx.save();const r=8;ctx.beginPath();ctx.roundRect(x+4,y+4,w-8,h-7,r);
  const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,c2);g.addColorStop(1,"#0d0d12");ctx.fillStyle=g;ctx.fill();
  ctx.shadowColor=catc;ctx.shadowBlur=6;ctx.lineWidth=2;ctx.strokeStyle=catc;ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle="rgba(255,255,255,.07)";ctx.beginPath();ctx.roundRect(x+w/2-15,y+10,30,30,8);ctx.fill();const li=logoImage(m);if(li.complete&&li.naturalWidth){try{ctx.drawImage(li,x+w/2-11,y+14,22,22);}catch(_){}}ctx.textAlign="center";
  ctx.fillStyle="#fff";ctx.font="700 9.5px Arial";
  const words=m.name.split(" ");let line="",ly=y+52;for(const wd of words){const t=line?line+" "+wd:wd;if(ctx.measureText(t).width>w-10){ctx.fillText(line,x+w/2,ly);ly+=11;line=wd;}else line=t;}ctx.fillText(line,x+w/2,ly);
  ctx.restore();
}
function renderListCanvas(scale=2,extraTop=0,extraBottom=0){

  const cv=document.createElement("canvas");cv.width=W*scale;cv.height=H*scale;const ctx=cv.getContext("2d");ctx.scale(scale,scale);
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);let y=extraTop;
  state.tiers.forEach((t,i)=>{const h=rows[i]*chh;ctx.fillStyle=t.color;ctx.fillRect(0,y,lab,h);ctx.fillStyle="#1b1b19";ctx.fillRect(lab,y,W-lab,h);
    ctx.fillStyle="#333";ctx.font="700 20px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t.label,lab/2,y+h/2);ctx.textBaseline="alphabetic";
    t.items.forEach((id,k)=>drawCard(ctx,id,lab+(k%per)*cw,y+Math.floor(k/per)*chh,cw,chh));y+=h+1;});

   <div class="mrow"><label>Columns</label><input class="inp ax" data-a="x0" style="width:110px"><input class="inp ax" data-a="x1" style="width:110px"><input class="inp ax" data-a="x2" style="width:110px"></div>
   <div class="mrow"><label>Rows</label><input class="inp ax" data-a="y0" style="width:110px"><input class="inp ax" data-a="y1" style="width:110px"><input class="inp ax" data-a="y2" style="width:110px"></div>
   <div class="agrid" id="agrid"></div>
   <p class="sub" style="margin-top:12px">Collection</p><div class="pool" id="apool" data-zone="align-pool" style="max-height:200px;overflow:auto;background:#121214"></div>
   <div class="mfoot"><button class="mini danger" data-clr type="button">Clear chart</button><button class="mini primary" data-x type="button">Done</button></div>`,(m,close,s)=>{
    m.querySelectorAll(".ax").forEach(inp=>{const [ax,i]=[inp.dataset.a[0],+inp.dataset.a[1]];inp.value=state.axes[ax][i];inp.setAttribute("aria-label",(ax==="x"?"Column ":"Row ")+(i+1));inp.oninput=()=>{state.axes[ax][i]=inp.value;save();renderAlign();};});
    m.querySelector("[data-x]").onclick=close;
    m.querySelector("[data-clr]").onclick=()=>{state.align={};save();renderAlign();};
    s._onclose=()=>{alignOpen=null;};
    alignOpen=s;renderAlign();
  });
};
function renderAlign(){
  if(!alignOpen)return;const g=alignOpen.querySelector("#agrid");g.innerHTML="";
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){const k=`${c}-${r}`;const cell=document.createElement("div");cell.className="acell";
    cell.innerHTML=`<div class="ah"></div><div class="az" data-zone="align-${k}"></div>`;cell.querySelector(".ah").textContent=`${state.axes.x[c]} ${state.axes.y[r]}`.replace("Neutral Neutral","True Neutral");
    (state.align[k]||[]).forEach(id=>cell.querySelector(".az").appendChild(cardEl(id)));g.appendChild(cell);}
  const used=new Set(Object.values(state.align).flat());const ap=alignOpen.querySelector("#apool");ap.innerHTML="";
  ORDER.filter(id=>!used.has(id)&&matches(BYID[id])).forEach(id=>ap.appendChild(cardEl(id)));
}
// align-pool drop = remove from chart
const _finish=finishDrag;finishDrag=function(){
  if(drag.zone&&drag.zone.dataset.zone==="align-pool"){const id=drag.id;cleanupDrag();for(const v of Object.values(state.align)){const i=v.indexOf(id);if(i>-1)v.splice(i,1)}save();renderAlign();return;}
  _finish();
};

// 9d + 9e. Live voting & community rank (shared db)
let db=null,me=null,canWrite=null,votesUnsub=null,allVotes=[];
const TIER_SCORE={S:5,A:4,B:3,C:2,D:1};
function myVoteDoc(){return db.doc("votes/"+me);}
function subscribeVotes(){
  if(votesUnsub||!db)return;
  votesUnsub=db.collection("votes").onSnapshot(snap=>{allVotes=snap.docs.map(d=>({id:d.id,...d.data()}));document.dispatchEvent(new Event("votes"));},()=>{votesUnsub=null;});
}
function voteCounts(id){const c={S:0,A:0,B:0,C:0,D:0};allVotes.forEach(v=>{const r=v.ranks||{};const t=r[id];if(c[t]!==undefined)c[t]++;});return c;}
function myRanks(){const mine=allVotes.find(v=>v.id===me);return mine&&mine.ranks?{...mine.ranks}:{};}
async function writeMyRanks(ranks){
  if(!db||!me)throw {code:"no_db"};
  await myVoteDoc().set({ranks,updatedAt:new Date().toISOString()});
}
function localVotesDb(){
  const K="ai-tier-local-votes";const subs=new Set();
  const read=()=>{try{return JSON.parse(localStorage.getItem(K)||"{}")}catch(e){return {}}};
  const snap=()=>{const all=read();return {docs:Object.entries(all).map(([id,v])=>({id,data:()=>v}))};};
  return {local:true,doc:p=>({set:async v=>{const all=read();all[p.split("/")[1]]=v;try{localStorage.setItem(K,JSON.stringify(all))}catch(e){};subs.forEach(f=>f(snap()));}}),
    collection:()=>({onSnapshot:(next)=>{subs.add(next);setTimeout(()=>next(snap()),0);return ()=>subs.delete(next);}})};
}
const localNote=()=>db&&db.local?`<div class="note" style="margin-bottom:10px">Local mode: this free version has no server, so votes are saved only in this browser. Shared live voting needs a backend, planned for a later stage.</div>`:"";
function needsDbNote(){return `<div class="note">Shared voting needs the artifact's live data, which isn't available in this view (for example a signed-out visitor or a local copy). Your own tier list still works and saves in this browser.</div>`;}

$("#btnPoll").onclick=()=>{
  const ranked=rankedIds();let current=(ORDER.find(id=>ranked.has(id))||ORDER[0]);
  modal(`<h3>Live Voting Poll</h3><p class="sub">Pick a model and vote its tier. Results update live for everyone who opens this page.</p>
   <div id="pollbody"></div><div class="mfoot"><button class="mini primary" data-x type="button">Close</button></div>`,(m,close,s)=>{
    m.querySelector("[data-x]").onclick=close;const body=m.querySelector("#pollbody");
    if(!db||!me){body.innerHTML=needsDbNote();return;}
    subscribeVotes();
    const render=()=>{
      const c=voteCounts(current);const total=Object.values(c).reduce((a,b)=>a+b,0);const mine=myRanks()[current];
      body.innerHTML=`<div class="mrow"><label for="psel">Model</label><select class="inp" id="psel" style="flex:1"></select></div>
        <div class="mrow" style="gap:14px;align-items:center"><div id="pcard"></div><div style="flex:1;min-width:0"><div class="vote" id="pvote"></div><div class="sub" style="margin:8px 0 0">${mine?`Your vote: <b style="color:#fff">${mine}</b> · tap another tier to change it`:canWrite===false?"You can view results but not vote on this page.":"You haven't voted on this model yet."}</div></div></div>
        <div class="bars" id="pbars"></div>${localNote()}<p class="sub" style="margin-top:10px">${total} vote${total===1?"":"s"} on this model · ${allVotes.length} voter${allVotes.length===1?"":"s"} on the page</p>`;
      const sel=body.querySelector("#psel");ORDER.forEach(id=>{const o=document.createElement("option");o.value=id;o.textContent=`${BYID[id].name} — ${BYID[id].provider}`;if(id===current)o.selected=true;sel.appendChild(o);});
      sel.onchange=()=>{current=sel.value;render();};
      body.querySelector("#pcard").appendChild(cardEl(current));
      const pv=body.querySelector("#pvote");["S","A","B","C","D"].forEach((t,i)=>{const b=document.createElement("button");b.type="button";b.className="vbtn";b.textContent=t;b.style.background=["#ff7f7f","#ffbf7f","#ffdf7f","#ffff7f","#bfff7f"][i];if(mine===t)b.style.outline="3px solid #fff";b.disabled=canWrite===false;
        b.onclick=async()=>{const r=myRanks();r[current]=t;b.disabled=true;try{await writeMyRanks(r);toast(`Voted ${t} for ${BYID[current].name}`);}catch(e){canWrite=false;toast("Your vote couldn't be saved on this page");render();}};pv.appendChild(b);});
      const bars=body.querySelector("#pbars");["S","A","B","C","D"].forEach((t,i)=>{const pct=total?Math.round(c[t]*100/total):0;bars.insertAdjacentHTML("beforeend",`<b>${t}</b><div class="bar"><i style="width:${pct}%;background:${["#ff7f7f","#ffbf7f","#ffdf7f","#ffff7f","#bfff7f"][i]}"></i></div><span>${c[t]}</span>`);});
    };
    render();const h=()=>render();document.addEventListener("votes",h);s._onclose=()=>document.removeEventListener("votes",h);
  });
};

$("#btnCommunity").onclick=()=>{
  modal(`<h3>Community Rank</h3><p class="sub">Average tier from everyone who voted on this page (S = 5 … D = 1). Submit your whole S–D list to add your votes in one go.</p>
   <div id="cbody"></div><div class="mfoot"><button class="mini" data-sub type="button">Submit my tier list as votes</button><button class="mini primary" data-x type="button">Close</button></div>`,(m,close,s)=>{
    m.querySelector("[data-x]").onclick=close;const body=m.querySelector("#cbody");const sub=m.querySelector("[data-sub]");
    if(!db||!me){body.innerHTML=needsDbNote();sub.hidden=true;return;}
    subscribeVotes();if(canWrite===false)sub.hidden=true;
    sub.onclick=async()=>{const r=myRanks();let n=0;state.tiers.forEach(t=>{const L=t.label.trim().toUpperCase();if(TIER_SCORE[L])t.items.forEach(id=>{r[id]=L;n++;});});
      if(!n){toast("Put models in the S–D tiers first");return;}sub.disabled=true;try{await writeMyRanks(r);toast(`Submitted ${n} votes`);}catch(e){canWrite=false;sub.hidden=true;toast("Your votes couldn't be saved on this page");}sub.disabled=false;};
    const render=()=>{
      const agg={};allVotes.forEach(v=>Object.entries(v.ranks||{}).forEach(([oid,t])=>{const id=canon(oid);if(!id||!TIER_SCORE[t])return;(agg[id]=agg[id]||{sum:0,n:0});agg[id].sum+=TIER_SCORE[t];agg[id].n++;}));
      const rows=Object.entries(agg).map(([id,a])=>({id,avg:a.sum/a.n,n:a.n})).sort((a,b)=>b.avg-a.avg||b.n-a.n);
      if(!rows.length){body.innerHTML=`${localNote()}<div class="note">No votes yet. Use the Live Voting Poll or submit your tier list to start the community ranking.</div>`;return;}
      const letter=a=>a>=4.5?"S":a>=3.5?"A":a>=2.5?"B":a>=1.5?"C":"D";
      body.innerHTML=`${localNote()}<p class="sub">${allVotes.length} voter${allVotes.length===1?"":"s"} · ${rows.length} models rated</p><div class="crank" id="cr"></div>`;
      const cr=body.querySelector("#cr");rows.slice(0,40).forEach((r,i)=>{const n=document.createElement("span");n.textContent=i+1;n.style.color="#a7a7ad";cr.appendChild(n);cr.appendChild(cardEl(r.id));
        const nm=document.createElement("div");nm.innerHTML=`<b></b><div class="sub" style="margin:2px 0 0"></div>`;nm.querySelector("b").textContent=BYID[r.id].name;nm.querySelector(".sub").textContent=`${r.n} vote${r.n===1?"":"s"}`;cr.appendChild(nm);
        const sc=document.createElement("b");sc.textContent=`${letter(r.avg)} · ${r.avg.toFixed(1)}`;cr.appendChild(sc);});
    };
    render();const h=()=>render();document.addEventListener("votes",h);s._onclose=()=>document.removeEventListener("votes",h);
  });
};


/* ============================================================
   11. SHARE LINKS (ranking lives in the URL fragment, never on a server)
   Format: #r=<base64url(deflate-raw(JSON))>  or  #j=<base64url(JSON)> fallback
   ============================================================ */
const MAX_HASH=12000;
const b64u={enc:u8=>{let s="";for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode(...u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");},
  dec:str=>{if(!/^[A-Za-z0-9_-]+$/.test(str))throw new Error("bad chars");const s=atob(str.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((str.length+3)%4));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}};
const canZip=typeof CompressionStream!=="undefined"&&typeof DecompressionStream!=="undefined";
async function pipe(u8,T,fmt){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new T(fmt))).arrayBuffer());}
function packRanking(){return {v:1,t:state.title,d:state.desc,r:state.tiers.map(t=>[t.label,t.color,t.items.slice()])};}
async function encodeRanking(){
  const json=new TextEncoder().encode(JSON.stringify(packRanking()));
  if(canZip){try{return "r="+b64u.enc(await pipe(json,CompressionStream,"deflate-raw"));}catch(e){}}
  return "j="+b64u.enc(json);
}
async function decodeRanking(hash){
  if(hash.length>MAX_HASH)throw new Error("This link is too long to be a valid ranking.");
  const m=/^#?(r|j)=([A-Za-z0-9_-]+)$/.exec(hash);if(!m)throw new Error("This link doesn't contain a ranking.");
  let bytes=b64u.dec(m[2]);
  if(m[1]==="r"){if(!canZip)throw new Error("This browser can't open compressed links. Try an up-to-date Chrome, Edge, Firefox or Safari.");bytes=await pipe(bytes,DecompressionStream,"deflate-raw");}
  if(bytes.length>200000)throw new Error("This ranking is too large.");
  const o=JSON.parse(new TextDecoder().decode(bytes));
  if(!o||o.v!==1||!Array.isArray(o.r)||!o.r.length||o.r.length>30)throw new Error("This ranking link is damaged or from an unsupported version.");
  const tiers=o.r.map((t,i)=>{if(!Array.isArray(t)||!Array.isArray(t[2]))throw new Error("This ranking link is damaged.");return {id:"t-"+i,label:String(t[0]??"").slice(0,40)||"?",color:String(t[1]),items:t[2].map(String)};});
  const clean=sanitize({title:String(o.t||"Shared ranking"),desc:String(o.d||""),tiers,align:{},axes:state.axes,filters:state.filters});
  return clean;
}
async function shareRanking(){
  let frag;try{frag=await encodeRanking();}catch(e){toast("Couldn't build the link");return;}
  if(frag.length>MAX_HASH){toast("This ranking is too large to fit in a link");return;}
  const base=IN_CLAUDE?null:location.origin+location.pathname;
  modal(`<h3>Share Ranking</h3><p class="sub">The whole ranking is packed into this link. Nothing is uploaded: anyone who opens it sees your tiers, title and order exactly as they are now. Later edits need a new link.</p>
   <div class="mrow"><textarea class="inp linkbox" id="slink" rows="3" readonly></textarea></div>
   <div class="mrow"><span class="counts" id="slen"></span></div>
   <div class="mfoot"><button class="mini" data-x type="button">Close</button><a class="mini" id="sopen" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Open link</a><button class="mini primary" data-copy type="button">Copy link</button></div>`,(m,close)=>{
    const box=m.querySelector("#slink");const open=m.querySelector("#sopen");
    if(base){const url=base+"#"+frag;box.value=url;open.href=url;m.querySelector("#slen").textContent=`${url.length} characters`;}
    else{box.value="Share links work on the public website version of this page (for example on GitHub Pages). Inside Claude, use Share on Twitter or Export JSON instead.";open.hidden=true;m.querySelector("[data-copy]").hidden=true;}
    m.querySelector("[data-x]").onclick=close;
    m.querySelector("[data-copy]").onclick=async()=>{try{await navigator.clipboard.writeText(box.value);toast("Link copied");}catch(e){box.focus();box.select();toast("Press Ctrl+C (or ⌘C) to copy");}};
  });
}
$("#btnShareRank").onclick=shareRanking;

function showBanner(kind,msg){
  const b=$("#banner");b.innerHTML="";if(!kind)return;
  const d=document.createElement("div");d.className="banner"+(kind==="error"?" err":"");
  const p=document.createElement("p");p.textContent=msg;d.appendChild(p);
  if(kind==="shared"){const c=document.createElement("button");c.className="mini primary";c.type="button";c.textContent="Copy & Edit";c.onclick=copyAndEdit;
    const back=document.createElement("button");back.className="mini";back.type="button";back.textContent="Back to my rankings";back.onclick=()=>{leaveShared();openLocal(store.cur);};d.append(c,back);}
  if(kind==="error"){const x=document.createElement("button");x.className="mini";x.type="button";x.textContent="Dismiss";x.onclick=()=>showBanner(null);d.appendChild(x);}
  b.appendChild(d);
}
function leaveShared(){readOnly=false;showBanner(null);try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}
function copyAndEdit(){
  const id=newId();const snap=snapshot();snap.title=("Copy of "+(state.title||"shared ranking")).slice(0,80);
  leaveShared();store.list[id]=snap;store.cur=id;persist();openLocal(id);toast("Saved as your own copy. Edit away.");
}
async function openFromHash(){
  const h=location.hash;if(!/^#(r|j)=/.test(h))return false;
  try{const r=await decodeRanking(h);readOnly=true;state={...state,...r,filters:state.filters};
    showBanner("shared",`You're viewing a shared ranking${state.title?` "${state.title}"`:""}. It's read-only. Press Copy & Edit to save your own editable copy in this browser.`);renderAll();return true;}
  catch(e){readOnly=false;const known=e&&e.message&&/link|ranking|browser/i.test(e.message);showBanner("error",known?e.message:"This ranking link is damaged or incomplete. Ask the sender to copy it again.");try{history.replaceState(null,"",location.pathname+location.search);}catch(_){}return false;}
}
window.addEventListener("hashchange",()=>{openFromHash();});

/* ============================================================
   12. MY RANKINGS (create, rename, duplicate, delete) — this browser only
   ============================================================ */
function rankingsModal(){
  modal(`<h3>My rankings</h3><p class="sub">These rankings are saved only in this browser on this device. To show one to someone else, open it and use Share Ranking.</p>
   <div class="rlist" id="rlist"></div>
   <div class="mfoot"><button class="mini" data-new type="button">+ New ranking</button><button class="mini primary" data-x type="button">Close</button></div>`,(m,close)=>{
    const paint=()=>{const host=m.querySelector("#rlist");host.innerHTML="";
      Object.entries(store.list).sort((a,b)=>(b[1].updated||0)-(a[1].updated||0)).forEach(([id,r])=>{
        const row=document.createElement("div");row.className="ritem"+(id===store.cur&&!readOnly?" cur":"");
        const n=(r.tiers||[]).reduce((a,t)=>a+(t.items||[]).length,0);
        row.innerHTML=`<div class="nm"><span class="t"></span><span class="meta"></span></div>`;
        row.querySelector(".t").textContent=r.title||"Untitled ranking";
        row.querySelector(".meta").textContent=`${n} ranked · edited ${new Date(r.updated||Date.now()).toLocaleDateString()}${id===store.cur&&!readOnly?" · open now":""}`;
        const mk=(label,fn,cls="mini")=>{const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=label;b.onclick=fn;row.appendChild(b);};
        mk("Open",()=>{if(readOnly)leaveShared();openLocal(id);close();});
        mk("Rename",()=>{const inp=document.createElement("input");inp.className="inp";inp.value=r.title||"";inp.maxLength=80;inp.setAttribute("aria-label","New name");const nm=row.querySelector(".nm");nm.replaceChildren(inp);inp.focus();inp.select();
          const done=()=>{r.title=inp.value.trim()||"Untitled ranking";r.updated=Date.now();persist();if(id===store.cur&&!readOnly){state.title=r.title;renderHead();}paint();};
          inp.onkeydown=e=>{if(e.key==="Enter")done();if(e.key==="Escape")paint();};inp.onblur=done;});
        mk("Duplicate",()=>{const nid=newId();store.list[nid]=JSON.parse(JSON.stringify({...r,title:("Copy of "+(r.title||"ranking")).slice(0,80),updated:Date.now()}));persist();paint();toast("Duplicated");});
        mk("Delete",()=>{if(Object.keys(store.list).length<=1){toast("Keep at least one ranking");return;}
          const sure=row.querySelector("[data-sure]");if(!sure){const b=document.createElement("button");b.type="button";b.className="mini danger";b.dataset.sure="1";b.textContent="Confirm delete";b.onclick=()=>{delete store.list[id];if(store.cur===id){store.cur=Object.keys(store.list)[0];if(!readOnly)openLocal(store.cur);}persist();paint();toast("Deleted");};row.appendChild(b);}},"mini danger");
        host.appendChild(row);});};
    paint();
    m.querySelector("[data-x]").onclick=close;
    m.querySelector("[data-new]").onclick=()=>{const id=newId();store.list[id]={title:"New AI ranking",desc:"",tiers:DEFAULT_TIERS(),align:{},axes:{x:["Lawful","Neutral","Chaotic"],y:["Good","Neutral","Evil"]},updated:Date.now()};if(readOnly)leaveShared();openLocal(id);close();toast("New ranking created");};
  });
}
$("#btnMine").onclick=rankingsModal;
$("#rtitle").addEventListener("input",e=>{if(readOnly)return;state.title=e.target.value;save();document.title=(state.title||"")+" · AI Models Tier List";});
$("#rdesc").addEventListener("input",e=>{if(readOnly)return;state.desc=e.target.value;save();});

(async()=>{
  if(!IN_CLAUDE){me="you";db=localVotesDb();subscribeVotes();return;}
  try{downloads=await window.claude.use("downloads");}catch(_){}

})();
